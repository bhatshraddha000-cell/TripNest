version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tripnest-postgres
    environment:
      POSTGRES_DB: tripnest_db
      POSTGRES_USER: tripnest_user
      POSTGRES_PASSWORD: tripnest_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripnest_user -d tripnest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripnest-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripnest_db
      SPRING_DATASOURCE_USERNAME: tripnest_user
      SPRING_DATASOURCE_PASSWORD: tripnest_password
      JWT_SECRET: tripnest-local-dev-secret-2026-07-06-4g8k2m9p7q1x5z3v
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      STORAGE_MODE: local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
