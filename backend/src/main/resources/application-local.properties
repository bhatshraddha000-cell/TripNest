# Local Development Profile - MySQL & Local Storage
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tripnest_db?createDatabaseIfNotExist=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

storage.mode=local
logging.level.com.tripnest.tripnest=DEBUG
