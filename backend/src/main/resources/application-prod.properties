# Production Profile - Render PostgreSQL & Cloudinary Storage
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tripnest_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Connection Pool Memory Optimization (512MB RAM Container)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Embedded Tomcat Thread & Connection Memory Optimization
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=10

# JPA / Hibernate Memory Optimizations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.integration.envers.enabled=false

# Disable Heavy OpenAPI / Swagger Class Scanning in Production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Enable Lazy Initialization in Production to reduce startup memory spike
spring.main.lazy-initialization=true

storage.mode=cloudinary
logging.level.com.tripnest.tripnest=INFO
logging.level.org.springframework.web=WARN
