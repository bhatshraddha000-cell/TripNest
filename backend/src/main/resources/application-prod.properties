# Production Profile - Render PostgreSQL & Cloudinary Storage
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tripnest_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Connection Pool Memory Optimization (512MB RAM Container)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Embedded Tomcat Thread Memory Optimization (Saves ~180MB RAM)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=200
server.tomcat.accept-count=20

# JPA / Hibernate Memory Optimizations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.generate_statistics=false

storage.mode=cloudinary
logging.level.com.tripnest.tripnest=INFO
logging.level.org.springframework.web=INFO
